<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: wayfinding-1.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zalando+Sans:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f5eae9}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1586px">
  <div class="r-browser-frame-artifact region chrome" data-region="browser-frame-artifact"><!-- Generated browser toolbar and address field above the page; a presentation artifact, not part of the website. --></div>
  <figure class="r-shield-logo region plate" data-region="shield-logo"><img src="../../../assets/plates/shield-logo.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-wordmark region text" data-region="wordmark"><!-- Protocolo Lupita wordmark, white bold text with a thin vertical separator. --><p style="line-height:1.05;margin:0">wordmark</p></div>
  <div class="r-nav-inicio region control" data-region="nav-inicio"><!-- Inicio navigation link with short gold active underline.: rebuild the control's chrome from the crop (comp-spec.mjs --crop nav-inicio); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-nav-como-funciona region control" data-region="nav-como-funciona"><!-- Cómo funciona navigation link in the right-aligned header.: rebuild the control's chrome from the crop (comp-spec.mjs --crop nav-como-funciona); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-nav-preguntas region control" data-region="nav-preguntas"><!-- Preguntas frecuentes navigation link in the header.: rebuild the control's chrome from the crop (comp-spec.mjs --crop nav-preguntas); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-nav-avisos region control" data-region="nav-avisos"><!-- Avisos navigation link at the far right of the header.: rebuild the control's chrome from the crop (comp-spec.mjs --crop nav-avisos); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-hero-heading region text" data-region="hero-heading"><!-- Large navy Spanish question: ¿Recibiste un mensaje o una llamada sospechosa? --><p style="font-size:var(--r-hero-heading-font);font-family:var(--r-hero-heading-family),sans-serif;font-weight:var(--r-hero-heading-weight);line-height:1.05;margin:0">hero-heading</p></div>
  <div class="r-hero-supporting-copy region text" data-region="hero-supporting-copy"><!-- Two lines explaining that the visitor can review a message and learn safe next steps. --><p style="font-size:var(--r-hero-supporting-copy-font);line-height:1.05;margin:0">hero-supporting-copy</p></div>
  <div class="r-primary-sms-action region control" data-region="primary-sms-action"><!-- Large gold directional plaque with chat icon, Revisar un SMS label, and right arrow.: rebuild the control's chrome from the crop (comp-spec.mjs --crop primary-sms-action); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-report-action region control" data-region="report-action"><!-- Outlined navy directional plaque with warning icon, Hacer un reporte label, and right arrow.: rebuild the control's chrome from the crop (comp-spec.mjs --crop report-action); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-route-branch region chrome" data-region="route-branch"><!-- Single gold route node and three-branch line connecting the destinations; a functional diagram, not decoration. --></div>
  <div class="r-route-sms region control" data-region="route-sms"><!-- Outlined directional plaque with SMS icon, Revisar SMS label, and arrow.: rebuild the control's chrome from the crop (comp-spec.mjs --crop route-sms); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-route-report region control" data-region="route-report"><!-- Outlined directional plaque with megaphone icon, Reportar label, and arrow.: rebuild the control's chrome from the crop (comp-spec.mjs --crop route-report); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-route-alerts region control" data-region="route-alerts"><!-- Outlined directional plaque with information icon, Consultar avisos label, and arrow.: rebuild the control's chrome from the crop (comp-spec.mjs --crop route-alerts); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-gold-horizontal-rule region chrome" data-region="gold-horizontal-rule"><!-- Thin gold horizontal divider above the secondary government route and demonstration note. --></div>
  <div class="r-government-entry region control" data-region="government-entry"><!-- Secondary government entrance with institutional icon, Entrada para gobierno label, and arrow.: rebuild the control's chrome from the crop (comp-spec.mjs --crop government-entry); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-government-demo-divider region chrome" data-region="government-demo-divider"><!-- Thin vertical gold divider between the government entrance and local-demo note. --></div>
  <div class="r-demo-note-icon region control" data-region="demo-note-icon"><!-- Small outlined information icon introducing the demonstration notice.: rebuild the control's chrome from the crop (comp-spec.mjs --crop demo-note-icon); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-demo-note region text" data-region="demo-note"><!-- Local-demo disclosure that the prototype is in demonstration and uses fictional data. --><p style="font-size:var(--r-demo-note-font);line-height:1.05;margin:0">demo-note</p></div>
</main>
</body>
</html>
