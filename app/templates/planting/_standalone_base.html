<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title | default("Protocolo Lupita") }}</title>
  <link rel="stylesheet" href="/static/public.css">
  <style>
    .container { max-width: 1120px; }
    .card { margin-bottom: 1rem; }
    .grid-kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:1rem; }
    .kpi { padding:1rem; border:1px solid var(--border); border-radius:10px; background:#fff; }
    .kpi-label { color:var(--muted); }
    .kpi-value { font-size:1.5rem; font-weight:800; }
    .badge { display:inline-block; padding:.15rem .55rem; border-radius:6px; background:#eaf0eb; color:var(--ink); font-size:.85rem; font-weight:700; }
    .badge-synthetic,.badge-indicio { background:#fff4d8; color:#543900; }
    .badge-corroborado { background:#e8f2eb; color:#124633; }
    .badge-sin_verificar { background:#edf0f2; color:#24333a; }
    .btn-secondary { background:#fff; color:var(--ink); }
    .split-2 { display:grid; grid-template-columns:1.2fr 1fr; gap:1rem; }
    .mono { overflow-wrap:anywhere; }
    @media(max-width:800px) { .split-2 { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  {% include "_public_header.html" %}
  <main id="main-content" class="container" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
  <footer class="public-footer">Protocolo Lupita · Información clara para prevenir engaños.</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
