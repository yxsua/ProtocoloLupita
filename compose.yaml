services:
  app:
    build:
      context: .
    image: protocolo-lupita:local
    env_file:
      - .env
    environment:
      APP_DATA_DIR: /var/lib/protocolo-lupita
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:8000"
    volumes:
      - app_data:/var/lib/protocolo-lupita
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  app_data:
    name: protocolo-lupita-data
