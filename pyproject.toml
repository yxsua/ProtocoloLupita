[project]
name = "protocolo-lupita"
version = "0.1.0"
description = "Prototipo local de atribución de filtraciones y análisis de campañas de fraude"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "faker>=30.0.0",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30,<1",
    "twilio>=9,<10",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.uv]
package = false

